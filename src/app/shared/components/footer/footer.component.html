<footer class="store-footer">
  <div class="footer-main">
    <div class="footer-brand">
      <a routerLink="/" class="footer-logo">
        URBANA
      </a>

      <p>
        Equipamentos e acessórios para quem busca funcionalidade,
        qualidade e estilo.
      </p>
    </div>

    <div class="footer-column">
      <h3>Explore</h3>
      <a routerLink="/">Início</a>
      <a routerLink="/catalog">Catálogo</a>
      <a routerLink="/catalog" [queryParams]="{ filter: 'offers' }">
        Ofertas
      </a>
    </div>

    <div class="footer-column">
      <h3>Minha conta</h3>
      <a routerLink="/auth">Entrar</a>
      <a routerLink="/favorites">Favoritos</a>
      <a routerLink="/cart">Carrinho</a>
    </div>
  </div>

  <div class="footer-bottom">
    <span>
      © {{ currentYear }} Urbana. Todos os direitos reservados.
    </span>

    <span class="footer-signature">
      TACTICAL PREMIUM
    </span>
  </div>
</footer>
