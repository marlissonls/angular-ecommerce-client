<section class="mx-auto max-w-[1280px] px-4 py-16 sm:px-6 lg:px-8 lg:py-20">
  <div class="mb-8">
    <span class="text-xs font-semibold uppercase tracking-[0.2em] text-[#747A74]">
      Novidades
    </span>

    <h2 class="mt-2 text-2xl font-bold tracking-tight text-[#272B28] sm:text-3xl">
      Acabaram de chegar
    </h2>

    <p class="mt-2 text-sm text-[#747A74]">
      Confira os lançamentos da Urbana.
    </p>
  </div>

  @if (loading()) {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
      @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track item) {
        <div class="animate-pulse">
          <div class="aspect-square rounded-xl bg-[#F3F1EA]"></div>
          <div class="mt-4 h-4 w-3/4 rounded bg-[#F3F1EA]"></div>
          <div class="mt-3 h-4 w-1/3 rounded bg-[#F3F1EA]"></div>
        </div>
      }
    </div>
  } @else if (products().length === 0) {
    <p class="text-sm text-[#747A74]">
      Nenhum lançamento disponível no momento.
    </p>
  } @else {
    <div class="grid grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 sm:gap-x-6 lg:grid-cols-4">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  }
</section>
