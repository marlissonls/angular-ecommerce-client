<article class="group min-w-0">
  <div class="relative flex aspect-square items-center justify-center overflow-hidden rounded-xl bg-[#F3F1EA]">
    <span class="text-xs font-medium uppercase tracking-widest text-[#A0A49D]">
      Urbana
    </span>

    @if (hasSale()) {
      <span class="absolute left-3 top-3 rounded-md bg-[#34483A] px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wider text-white">
        Oferta
      </span>
    }

    @if (product().stock <= 0) {
      <div class="absolute inset-0 flex items-center justify-center bg-[#202B24]/50">
        <span class="rounded-md bg-white px-3 py-2 text-xs font-semibold text-[#272B28]">
          Indisponível
        </span>
      </div>
    }
  </div>

  <div class="pt-4">
    <h3 class="line-clamp-2 min-h-10 text-sm font-medium leading-5 text-[#272B28] transition-colors group-hover:text-[#34483A]">
      {{ product().title }}
    </h3>

    <div class="mt-3 flex flex-wrap items-baseline gap-2">
      @if (hasSale()) {
        <span class="text-base font-bold text-[#34483A]">
          {{ formatPrice(product().salePrice!) }}
        </span>

        <span class="text-xs text-[#747A74] line-through">
          {{ formatPrice(product().price) }}
        </span>
      } @else {
        <span class="text-base font-bold text-[#272B28]">
          {{ formatPrice(product().price) }}
        </span>
      }
    </div>
  </div>
</article>
